[project]
name = "diffrax-bdf"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "groves.teddy@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "diffrax>=0.7.2",
]

[project.scripts]
diffrax-bdf = "diffrax_bdf:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["tests"]
testpaths = ["tests"]
